<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Otto · Canvas v5 — amber, professional, two themes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Inter (UI) + JetBrains Mono (technical). No others. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />

  <style>
    html, body {
      margin: 0; padding: 0;
      font-family: 'Inter';
      background: #f0eee9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { width: 100vw; height: 100vh; overflow: hidden; }

    @keyframes otto-spin   { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes otto-pulse  { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes otto-bolt   { 0%,100% { box-shadow: 0 0 0 0 rgba(255,111,26,0); } 50% { box-shadow: 0 0 0 6px rgba(255,111,26,0.18); } }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="otto-v5-data.jsx"></script>
  <script type="text/babel" src="otto-v5-parts.jsx"></script>
  <script type="text/babel" src="otto-v5.jsx"></script>
</body>
</html>
