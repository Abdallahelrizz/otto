version: '3.9'

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB:       otto
      POSTGRES_USER:     otto
      POSTGRES_PASSWORD: otto_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run schema.sql on first boot (only if DB is empty)
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U otto -d otto']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Otto server ───────────────────────────────────────────────────────────

  otto:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL:              postgresql://otto:otto_dev@postgres:5432/otto
      REDIS_URL:                 redis://redis:6379
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env}
      PORT:                      3000
      HOST:                      0.0.0.0
      # Optional — nodes fall back to these if no credential is attached
      OPENAI_API_KEY:            ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY:         ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY:        ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
