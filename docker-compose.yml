services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB:       otto
      POSTGRES_USER:     otto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otto_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U otto -d otto']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true
    volumes:
      - piston_data:/piston
    restart: unless-stopped

  piston-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - piston
    restart: 'no'
    command: >
      sh -c "
      until curl -fsS http://piston:2000/api/v2/packages >/dev/null 2>&1; do sleep 2; done;
      curl -fsS -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\":\"node\",\"version\":\"18.x\"}' || true;
      curl -fsS -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\":\"python\",\"version\":\"3.11.x\"}' || true;
      curl -fsS -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{\"language\":\"bash\",\"version\":\"5.x\"}' || true;
      echo done
      "

  # ─── Otto ──────────────────────────────────────────────────────────────────

  otto:
    image: ghcr.io/abdallahelrizz/otto:latest
    # To build locally instead: comment the line above and uncomment below
    # build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL:              postgresql://otto:${POSTGRES_PASSWORD:-otto_dev}@postgres:5432/otto
      REDIS_URL:                 redis://redis:6379
      PISTON_URL:                http://piston:2000
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env}
      API_KEY_PEPPER:            ${API_KEY_PEPPER:?set API_KEY_PEPPER in .env}
      ALLOWED_ORIGINS:           ${ALLOWED_ORIGINS:-http://localhost:3000}
      SESSION_DAYS:              ${SESSION_DAYS:-7}
      PORT:                      3000
      HOST:                      0.0.0.0
      NODE_ENV:                  production
      WORKER_CONCURRENCY:        ${WORKER_CONCURRENCY:-10}
      EXECUTION_RETENTION_DAYS:  ${EXECUTION_RETENTION_DAYS:-30}
      OPENAI_API_KEY:            ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY:         ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY:        ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - otto_files:/app/files

volumes:
  postgres_data:
  redis_data:
  piston_data:
  otto_files:
