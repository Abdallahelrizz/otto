<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Otto · Node Cards v2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ─── Multi-font system ───────────────────────────────────────────
       Inter         — UI chrome, inspector labels, sidebar
       Geist Mono    — code fields, parameter values, monospace data
       JetBrains Mono — node type labels, handle labels, exec logs
       Fraunces      — workflow name + empty state heading (serif accent)
  ─────────────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" />

  <style>
    /* Geist Mono — kept for code/param fields, served locally */
    @font-face {
      font-family: 'Geist Mono';
      src: url('fonts/GeistMono-Variable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter';   /* per spec: never system-ui as fallback */
      background: #f0eee9;    /* design-canvas warm-gray; nodes live on dark inside artboards */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { width: 100vw; height: 100vh; overflow: hidden; }

    /* Idle pulse for node selection / running */
    @keyframes otto-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>

  <!-- ─── React + Babel ──────────────────────────────────────────── -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- ─── Lucide icon library (UMD) — exposes window.lucide.icons ── -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="node-cards-v2.jsx"></script>
</body>
</html>
