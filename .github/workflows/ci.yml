name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Infra-free unit suites (no Postgres/Redis needed).
      # Single source of truth: package.json "test". Keep them in sync — do not
      # re-list files here, or CI and local `npm test` silently drift apart.
      - name: Run unit tests
        run: npm test

      # SSRF egress guard — needs no infra, but does resolve DNS.
      - name: SSRF guard smoke
        run: node test/ssrf-smoke.js

  canvas-typecheck:
    name: Canvas typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: canvas/package-lock.json
      - name: Install canvas deps
        working-directory: canvas
        run: npm ci
      - name: Generate service node defs
        working-directory: canvas
        run: npm run gen:nodes
      - name: Typecheck
        working-directory: canvas
        run: npx tsc --noEmit
